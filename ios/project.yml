name: MiPlata

options:
  bundleIdPrefix: cl.barckhahn
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MiPlata:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.barckhahn.miplata
        PRODUCT_NAME: MiPlata
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mi Plata
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  MiPlata:
    build:
      targets:
        MiPlata: all
    run:
      config: Debug
    archive:
      config: Release
