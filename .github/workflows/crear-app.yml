name: Crear app Mi Plata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crear-ipa:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Verificar archivos de la app
        run: |
          test -f ios/project.yml || {
            echo "Falta agregar el proyecto iOS. Todavía no ejecutes este archivo."
            exit 1
          }

      - name: Instalar herramientas
        run: brew install xcodegen

      - name: Generar proyecto de Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Compilar para iPhone
        run: |
          xcodebuild \
            -project ios/MiPlata.xcodeproj \
            -scheme MiPlata \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Crear instalador
        run: |
          mkdir -p empaquetado/Payload
          cp -R build/Build/Products/Release-iphoneos/MiPlata.app empaquetado/Payload/
          cd empaquetado
          zip -r MiPlata.ipa Payload

      - name: Guardar instalador para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MiPlata-iPhone
          path: empaquetado/MiPlata.ipa
          if-no-files-found: error
          retention-days: 7
